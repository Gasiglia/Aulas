<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encriptador de Texto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f3f5fc;
        }
       
       
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            resize: none;
            background: transparent;

        }
        button {
            width: 100%;
            padding: 10px 40px;
            margin-top: 10px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-primary {
            background-color: #0a3871;
            color: white;
        }
        .btn-secondary {
            background-color: #d8dfe8;
            border: 1px solid #0a3871;
            color: #0a3871;
        }
        .historico {
            margin-top: 20px;
            width: 100%;
        }
        .historico p {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8e8e8;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 5px;
        }
        .historico button {
            background: #0a3871;
            color: white;
            border-radius: 3px;
            padding: 5px;
        }



        @media (max-width: 1100px) {
            .left, .right {
            flex: 1;
            padding: 20px;
        }
        .left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .direita {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 10px 10px 10px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            box-sizing: border-box;
        }
        }




        @media (min-width: 1101px) {
            .container {
            display: flex;
            width: 100%;
            height: 100%;
            
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
            .left, .right {
            flex: 1;
            padding: 20px;
        }
        .left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .direita {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 10px 10px 10px 10px rgba(0, 0, 0, 0.1);
            width: 20vw;
            box-sizing: border-box;
        }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h2 style="color: #0a3871;">Digite seu texto</h2>
            <textarea id="entrada" placeholder="Digite seu texto..."></textarea>
        <p style="color: #495057; font-size: 12px; opacity: 0.8;">Apenas letras minúsculas e sem acento.</p>
            <div style="display: flex; gap: 10px">
                
            <button class="btn-primary" onclick="criptografar()">Criptografar</button>
            <button class="btn-secondary" onclick="descriptografar()">Descriptografar</button>
        </div>
        </div>
        <div class="direita">
            <div id="mensagem" class="mensagem">
            <img src="image.png" alt="Imagem" style="width: 100%;">
            <h3>Nenhuma mensagem encontrada</h3>
            <p>Digite um texto que você deseja criptografar ou descriptografar.</p>
            </div>
            <div class="historico" id="historico"></div>
        </div>
    </div>
    <script>
        let historico = [];

        function criptografar() {
            let texto = document.getElementById("entrada").value;
            if (!validarTexto(texto)) {
                alert("Apenas letras minúsculas sem acentos e caracteres especiais são permitidas.");
                return;
            }
            let textoCriptografado = texto
                .replace(/e/g, "enter")
                .replace(/i/g, "imes")
                .replace(/a/g, "ai")
                .replace(/o/g, "ober")
                .replace(/u/g, "ufat");
            historico.push(textoCriptografado);
            atualizarHistorico();
        }

        function descriptografar() {
            let texto = document.getElementById("entrada").value;
            let textoDescriptografado = texto
                .replace(/enter/g, "e")
                .replace(/imes/g, "i")
                .replace(/ai/g, "a")
                .replace(/ober/g, "o")
                .replace(/ufat/g, "u");
            document.getElementById("entrada").value = textoDescriptografado;
        }

        function validarTexto(texto) {
            return /^[a-z ]+$/.test(texto);
        }

        function atualizarHistorico() {
            let divHistorico = document.getElementById("historico");
            let mensagemDiv = document.getElementById("mensagem");
            divHistorico.innerHTML = "";

            if (historico.length > 0) {
                mensagemDiv.classList.add("ocultar");
                divHistorico.innerHTML = "<h3>Histórico</h3>";
                historico.forEach((texto, index) => {
                    divHistorico.innerHTML += `<p>${texto} <button onclick="copiar('${texto}')">Copiar</button></p>`;
                });
            } else {
                mensagemDiv.classList.remove("ocultar");
            }
        }

        function copiar(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                alert("Texto copiado!");
            });
        }
    </script>
</body>
</html>
