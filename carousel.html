<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha seu personagem</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="background: url('code.png') no-repeat center center fixed;">
        <h1>Escolha seu personagem</h1>
        <div class="container">
            <img id="fixedImage" class="fixed-image" src="robo5.png" alt="Imagem Fixa">

            
            <div class="carousel">
                <div class="carousel-inner">
                    <div class="grid-item"><img src="robo5.png" alt="Imagem 4"></div>
                    
                    <div class="grid-item"><img src="robo6.png" alt="Imagem 3"></div>
                    <div class="grid-item"><img src="robo7.png" alt="Imagem 3"></div>
                    <div class="grid-item"><img src="robo8.png" alt="Imagem 3"></div>
                    <div class="grid-item"><img src="robo9.png" alt="Imagem 3"></div>
                    <div class="grid-item"><img src="robo10.png" alt="Imagem 3"></div>
                    <div class="grid-item"><img src="robo11.png" alt="Imagem 3"></div>
                    <div class="grid-item"><img src="robo12.png" alt="Imagem 5"></div>
                    
                </div>
                <button class="prev" onclick="prevSlide()">❮</button>
                <button class="next" onclick="nextSlide()">❯</button>
            </div>
        </div>
    </div>
    <script src="script_carousel.js"></script>
</body>
</html>
